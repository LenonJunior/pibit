<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Lava-Jato</title>
    <!-- Referência ao arquivo de manifesto da PWA -->
    <link rel="manifest" href="./manifest.json">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Sistema Lava-Jato</h1>
        
        <!-- Formulário de Entrada de Carro -->
        <div class="mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Entrada de Carro</h2>
            <form id="car-form" class="space-y-4">
                <div>
                    <label for="placa" class="block text-sm font-medium text-gray-700">Placa:</label>
                    <input type="text" id="placa" name="placa" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                </div>
                <div>
                    <label for="modelo" class="block text-sm font-medium text-gray-700">Modelo:</label>
                    <input type="text" id="modelo" name="modelo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                </div>
                <div>
                    <label for="servico" class="block text-sm font-medium text-gray-700">Serviço:</label>
                    <select id="servico" name="servico" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        <option value="Lavagem Simples">Lavagem Simples</option>
                        <option value="Lavagem Completa">Lavagem Completa</option>
                        <option value="Polimento">Polimento</option>
                        <option value="Higienização">Higienização</option>
                    </select>
                </div>
                <div id="status-message" class="text-center text-sm font-medium"></div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Adicionar Carro
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Carros em Lavagem -->
        <div>
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Carros em Lavagem</h2>
            <div id="cars-list" class="space-y-4">
                <!-- A lista de carros será renderizada aqui pelo JavaScript -->
            </div>
            <p id="no-cars-message" class="text-center text-gray-500 mt-4 hidden">Nenhum carro em lavagem no momento.</p>
        </div>
    </div>

    <!-- Script JavaScript para a lógica do Front-end -->
    <script>
        const BASE_URL = 'http://localhost:5000';
        const carForm = document.getElementById('car-form');
        const carsList = document.getElementById('cars-list');
        const statusMessage = document.getElementById('status-message');
        const noCarsMessage = document.getElementById('no-cars-message');

        // Função para mostrar mensagens de status
        function showStatusMessage(message, type = 'success') {
            statusMessage.textContent = message;
            if (type === 'success') {
                statusMessage.className = 'text-center text-sm font-medium text-green-600';
            } else {
                statusMessage.className = 'text-center text-sm font-medium text-red-600';
            }
            setTimeout(() => {
                statusMessage.textContent = '';
            }, 3000);
        }

        // Função para buscar e renderizar a lista de carros
        async function fetchCars() {
            try {
                const response = await fetch(`${BASE_URL}/carros`);
                const cars = await response.json();

                carsList.innerHTML = ''; // Limpa a lista antes de renderizar

                if (cars.length === 0) {
                    noCarsMessage.classList.remove('hidden');
                } else {
                    noCarsMessage.classList.add('hidden');
                    cars.forEach(car => {
                        const carElement = document.createElement('div');
                        carElement.className = 'flex items-center justify-between bg-gray-50 p-4 rounded-md shadow-sm';
                        carElement.innerHTML = `
                            <div>
                                <h3 class="text-lg font-medium text-gray-900">${car.modelo} (${car.placa})</h3>
                                <p class="text-sm text-gray-500">${car.servico}</p>
                            </div>
                            <div>
                                <button data-placa="${car.placa}" class="complete-button py-1 px-3 bg-green-500 text-white rounded-md hover:bg-green-600">
                                    Marcar como Concluído
                                </button>
                            </div>
                        `;
                        carsList.appendChild(carElement);
                    });
                }
            } catch (error) {
                console.error('Erro ao buscar carros:', error);
                showStatusMessage('Erro ao carregar a lista de carros.', 'error');
            }
        }

        // Função para lidar com o envio do formulário
        carForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const placa = document.getElementById('placa').value;
            const modelo = document.getElementById('modelo').value;
            const servico = document.getElementById('servico').value;
            
            try {
                const response = await fetch(`${BASE_URL}/carros`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ placa, modelo, servico }),
                });

                if (response.ok) {
                    showStatusMessage('Carro adicionado com sucesso!');
                    carForm.reset();
                    fetchCars(); // Atualiza a lista após o cadastro
                } else {
                    showStatusMessage('Erro ao adicionar carro. Tente novamente.', 'error');
                }
            } catch (error) {
                console.error('Erro na requisição POST:', error);
                showStatusMessage('Erro de conexão com o servidor.', 'error');
            }
        });

        // Event listener para os botões "Marcar como Concluído" usando delegação
        carsList.addEventListener('click', async (e) => {
            if (e.target.classList.contains('complete-button')) {
                const placa = e.target.dataset.placa;
                try {
                    const response = await fetch(`${BASE_URL}/carros/${placa}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (response.ok) {
                        showStatusMessage(`Serviço para a placa ${placa} concluído!`);
                        fetchCars(); // Atualiza a lista após a conclusão
                    } else {
                        showStatusMessage(`Erro ao concluir serviço para a placa ${placa}.`, 'error');
                    }
                } catch (error) {
                    console.error('Erro na requisição PUT:', error);
                    showStatusMessage('Erro de conexão com o servidor.', 'error');
                }
            }
        });

        // Chama a função para carregar a lista de carros na inicialização
        window.addEventListener('load', fetchCars);
        
        // Código para registrar o Service Worker da PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
              .then(registration => {
                console.log('Service Worker registrado com sucesso:', registration);
              })
              .catch(error => {
                console.log('Falha no registro do Service Worker:', error);
              });
          });
        }
    </script>
</body>
</html>
